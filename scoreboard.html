<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Syndicate — Scoreboard</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body { overflow: hidden; }
    .scoreboard-page { height: 100dvh; }
